<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escolha suas opções</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .btn.btn-danger.btn-sm.ms-2 {
        border-radius: 17px;
        font-size: 14px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">Selecione suas opções</h2>

    <!-- Dropdown -->
    <div class="mb-3">
        <select id="dropdownOpcoes" class="form-select">
            <option value="">Selecione uma opção...</option>
            {% for opcao in opcoes %}
                <option value="{{ opcao.nome }}">{{ opcao.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Botões de escolhas -->
    <div id="escolhasContainer" class="mb-3">
        <h4>Escolhas:</h4>
        <div id="escolhas" class="d-flex flex-wrap gap-2"></div>
    </div>

    <!-- Botão Buscar -->
    <button id="buscarBtn" class="btn btn-primary">Buscar Pedido</button>

    <!-- Resultados -->
    <div id="resultado" class="mt-4"></div>
</div>

<script>
    let escolhas = [];

    $(document).ready(function() {
        $("#dropdownOpcoes").change(function() {
            let opcao = $(this).val();
            if (opcao && !escolhas.includes(opcao)) {
                escolhas.push(opcao);
                atualizarEscolhas();
            }
        });

        function atualizarEscolhas() {
            $("#escolhas").empty();
            escolhas.forEach(function(opcao) {
                $("#escolhas").append(
                    `<div class="btn btn-info position-relative">
                        ${opcao}
                        <button class="btn btn-danger btn-sm ms-2" onclick="removerEscolha('${opcao}')">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>`
                );
            });
        }

        window.removerEscolha = function(opcao) {
            escolhas = escolhas.filter(e => e !== opcao);
            atualizarEscolhas();
        };

        $("#buscarBtn").click(function() {
            $.ajax({
                url: "/buscar/",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ escolhas: escolhas }),
                success: function(response) {
                    $("#resultado").html(`<h5>Resultados encontrados:</h5><ul class="list-group">
                        ${response.resultados.map(op => `<li class="list-group-item">${op}</li>`).join('')}
                    </ul>`);
                }
            });
        });
    });
</script>

</body>
</html>
