<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escolha suas opções</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .list-group-item {

            margin-bottom: 24px;
        }
        .btn.btn-warning {
            margin-bottom: 24px;
        }
        .btn.btn-danger.btn-sm.ms-2 {
           border-radius: 17px;
           font-size: 14px;
        }
        .position-relative {
            position: relative !important;
            background: #0000ff1f;
        }
        .btn.btn-amarelo.position-relative {
            background: beige;
            color: black;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center">Selecione suas opções</h2>

    <!-- Botões de rádio para escolher entre Soluções e Setores -->
    <div class="mb-3">
        <label>
            <input type="radio" name="opcao" value="solucoes" checked> Soluções
        </label>
        <label>
            <input type="radio" name="opcao" value="setores"> Setores
        </label>
    </div>

    <!-- Dropdown -->
    <div class="mb-3">
        <select id="dropdownOpcoes" class="form-select">
            <option value="">Selecione uma opção...</option>
            {% for solucao in solucoes %}
                <option value="{{ solucao.nome }}" data-tipo="solucao">{{ solucao.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Botões de escolhas -->
    <div id="escolhasContainer" class="mb-3">
        <h4>Escolhas:</h4>
        <div id="escolhas" class="d-flex flex-wrap gap-2"></div>
    </div>

    <!-- Botão Buscar -->
    <button id="buscarBtn" class="btn btn-primary">Buscar Pedido</button>

    <!-- Resultados -->
    <div id="resultado" class="mt-4"></div>
</div>

<script>
    let escolhas = [];

    $(document).ready(function() {
        // Atualiza o dropdown quando o radio é alterado
        $("input[name='opcao']").change(function() {
            atualizarDropdown();
        });

        function atualizarDropdown() {
            $("#dropdownOpcoes").empty().append('<option value="">Selecione uma opção...</option>');
            
            let tipoSelecionado = $("input[name='opcao']:checked").val();
            if (tipoSelecionado === 'solucoes') {
                {% for solucao in solucoes %}
                    $("#dropdownOpcoes").append(`<option value="{{ solucao.nome }}" data-tipo="solucao">{{ solucao.nome }}</option>`);
                {% endfor %}
            } else {
                {% for setor in setores %}
                    $("#dropdownOpcoes").append(`<option value="{{ setor.nome }}" data-tipo="setor">{{ setor.nome }}</option>`);
                {% endfor %}
            }
        }
        $("#dropdownOpcoes").change(function() {
            let opcao = $(this).val();
            let tipo = $(this).find("option:selected").data("tipo");

            if (opcao && !escolhas.some(e => e.nome === opcao)) {
                escolhas.push({ nome: opcao, tipo: tipo });
                atualizarEscolhas();
            }
        });

        function atualizarEscolhas() {
            // Verifica se há escolhas, caso contrário esconde a lista e zera o dropdown
            if (escolhas.length === 0) {
                $("#escolhas").empty();  // Remove as escolhas da tela
                $("#dropdownOpcoes").val("");  // Zera o valor do dropdown
            } else {
                $("#escolhas").empty();  // Limpa a lista de escolhas
                escolhas.forEach(({ nome, tipo }) => {
                    let corClasse = tipo === 'solucao' ? 'btn-azul' : 'btn-amarelo';
                    $("#escolhas").append(
                        `<div class="btn ${corClasse} position-relative">
                            ${nome}
                            <button class="btn btn-danger btn-sm ms-2" onclick="removerEscolha('${nome}')">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>`
                    );
                });
            }
        }

        window.removerEscolha = function(opcao) {
            escolhas = escolhas.filter(e => e.nome !== opcao);
            atualizarEscolhas(); // Atualiza a lista e o dropdown
        };

        $("#buscarBtn").click(function() {
            const produtoId = "{{ produto_id }}";
            // Desabilita o botão para evitar múltiplos cliques
            $(this).prop("disabled", true);
            
            console.log("Buscando projetos...",produtoId);
            // Coleta as escolhas do usuário com seus tipos
            let escolhas = [];
            $("#escolhas .btn").each(function() {
                let nome = $(this).text().trim();
                let tipo = $(this).hasClass("btn-azul") ? "solucao" : "setor";

                // Adiciona apenas se o nome não for vazio
                if (nome) {
                    escolhas.push({ nome: nome, tipo: tipo });
                }
            });

            // Verifica se há escolhas válidas antes de enviar a requisição
            if (escolhas.length === 0) {
                alert("Por favor, selecione pelo menos uma opção.");
                $(this).prop("disabled", false);  // Reabilita o botão
                return;
            }

            // Envia as escolhas para o backend via AJAX
            $.ajax({
                url: "/projects/filtrar_projetos/",  // Endpoint para filtrar projetos
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ 
                    escolhas: escolhas, 
                    produto_id: produtoId 
                }),
                success: function(response) {
                    // Exibe os resultados filtrados
                    let resultadoHtml = `<h5>Resultados encontrados:</h5>
                        <ul class="list-group">
                            ${response.projetos.map(projeto => `<li class="list-group-item">${projeto.nome}</li>`).join('')}
                        </ul>`;

                    // Se houver mais de um projeto, adiciona a div com o botão
                    if (response.projetos.length > 1) {
                        resultadoHtml += `
                            <div class="mt-3">
                                <p><strong>As funcionalidades e especialidades que você procura estão em outros projetos. Estes podem ser misturados para criar a solução ideal. </strong></p>
                                <button class="btn btn-warning" onclick="misturarProjetos()">Clique aqui para misturar projetos</button>
                            </div>`;
                    }

                    $("#resultado").html(resultadoHtml);
                },
                error: function(xhr, status, error) {
                    console.error("Erro ao buscar projetos:", error);
                },
                complete: function() {
                    // Reabilita o botão após a requisição ser concluída
                    $("#buscarBtn").prop("disabled", false);
                }
            });
        });
    });
</script>


</body>
</html>
