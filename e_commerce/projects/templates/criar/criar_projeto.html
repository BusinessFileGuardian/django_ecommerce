<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Projeto - Trabalhando nisso!</title>
    <style>
        body {
            background-image: url('https://media.giphy.com/media/l0HlNQ03J5JxX6lva/giphy.gif'); /* Imagem engraçada de fundo */
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            font-size: 2em;
        }
        p {
            font-size: 1.2em;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            background: #ffcc00;
            color: black;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background: #ffaa00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚧 Criando seu projeto... ou quase! 🚧</h1>
        <p>Estamos trabalhando duro (ou pelo menos fingindo bem). Enquanto isso, aproveite um café! ☕</p>
        <button onclick="alert('Calma, jovem! Logo estará pronto!')">Criar Projeto</button>
    </div>
</body>
</html>
