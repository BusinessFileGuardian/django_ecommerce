{% load static %}
<!doctype html>
<html lang="en">
  <head>
  <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
          <!-- fevicon -->
          <link rel="icon" href="{% static 'images/fevicon.png' %}" type="image/gif" />
          <!-- Tweaks for older IEs-->
          <link rel="icon" href="{% static 'icon/favicon-321x321.png' %}" type="image/png">
          <!-- Outros tamanhos de favicon (caso necessário) -->

          <link rel="icon" href="{% static 'icon/android-chrome-192x192.png' %}" sizes="192x192" type="image/png">
          <link rel="icon" href=""{% static 'icon/apple-touch-icon-1.png' %}" sizes="180x180" type="image/png">
    <title>Acateia.Cloud</title>
    {% include 'base/css.html' %}
    {% block base_head %}{% endblock base_head %}
  </head>
  <body>
    {% include 'base/navbar.html' with nome_da_marca='Alcateia.Cloud' %}
    <div class='container'>
      {% block content %} {% endblock %}
    </div>
    {% include 'base/footer.html' %}
    {% include 'base/js.html' %}
    
  </body>
</html>
