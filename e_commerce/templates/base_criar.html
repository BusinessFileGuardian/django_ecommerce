{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Cadastro de Interesse no Projeto</h2>
    
    <p>Passo {{ wizard.steps.current }} de {{ wizard.steps.count }}</p>

    <form method="post">
        {% csrf_token %}
        
        <div class="progress mb-3">
            <div class="progress-bar" role="progressbar" 
                style="width: {{ wizard.steps.current|div:wizard.steps.count|mul:100 }}%" 
                aria-valuenow="{{ wizard.steps.current }}" 
                aria-valuemin="0" 
                aria-valuemax="{{ wizard.steps.count }}">
            </div>
        </div>

        {{ wizard.management_form }}
        {{ wizard.form.as_p }}

        <button type="submit" class="btn btn-primary">
            {% if wizard.steps.current == wizard.steps.last %}
                <i class="fas fa-check"></i> Finalizar
            {% else %}
                <i class="fas fa-arrow-right"></i> Próximo
            {% endif %}
        </button>
    </form>
</div>
{% endblock %}
